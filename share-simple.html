<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>簡易圖片分享</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,'Segoe UI','Microsoft JhengHei',sans-serif;color:#17233a;background:#f3f6fa}
*{box-sizing:border-box}body{margin:0;padding:48px 20px}main{max-width:480px;margin:auto;background:#fff;border:1px solid #e1e7ef;border-radius:24px;padding:32px;box-shadow:0 12px 40px #21355309}
.label{font-size:12px;font-weight:700;letter-spacing:.12em;color:#537195}h1{font-size:28px;margin:12px 0}p{line-height:1.8;color:#586779;margin:8px 0 24px}.step{font-size:14px;font-weight:650;display:block;margin:24px 0 12px}
input{display:block;width:100%;font:inherit;font-size:14px;color:#586779}input::file-selector-button{font:inherit;border:1px solid #d6deea;border-radius:10px;padding:12px 16px;margin-right:10px;background:#f5f8fc;color:#253c5c;cursor:pointer}
#selected{min-height:24px;margin:12px 0 0;font-size:13px;overflow-wrap:anywhere}
#share{width:100%;border:0;border-radius:12px;background:#2263ca;color:#fff;padding:16px;font-size:17px;font-weight:650;cursor:pointer}#share:disabled{background:#e5eaf1;color:#8a95a5;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #9cc3ff;outline-offset:3px}.note{font-size:13px;margin:18px 0 0}details{margin-top:28px;border-top:1px solid #e8edf4;padding-top:18px;color:#67778b;font-size:13px}summary{cursor:pointer}#result{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 inherit;background:#f5f7fa;padding:14px;border-radius:8px}footer{text-align:center;color:#8290a3;font-size:12px;margin-top:20px}
@media(max-width:400px){body{padding:24px 14px}main{padding:24px}}
</style>
</head>
<body>
<main>
  <div class="label">SIMPLE SHARE</div>
  <h1>簡易圖片分享</h1>
  <p>選一張圖片，開啟系統分享，再選 LINE。</p>
  <label class="step" for="picture">1. 選擇圖片</label>
  <input id="picture" type="file" accept="image/jpeg,image/png">
  <p id="selected" aria-live="polite">支援 JPG、PNG；每次分享一張。</p>
  <div class="step">2. 開啟分享</div>
  <button id="share" type="button" disabled>分享圖片</button>
  <p class="note">選 LINE 後，到聊天室選擇畫面即可，不必送出。</p>
  <details id="details"><summary>查看本次結果</summary><div id="result">尚未分享。</div></details>
</main>
<footer>簡易分享 · 2026.10.01-simple1</footer>
<script>
'use strict';
const picker = document.getElementById('picture');
const shareButton = document.getElementById('share');
const selected = document.getElementById('selected');
const result = document.getElementById('result');
let chosen = null;
let pending = false;
let lastResult = '尚未分享。';

picker.addEventListener('change', () => {
  if (pending) {
    chosen = null;
    picker.value = '';
    shareButton.disabled = true;
    selected.textContent = '上一個系統分享尚未結束，請先完成或關閉它，再選圖片。';
    return;
  }
  chosen = picker.files && picker.files[0] || null;
  shareButton.disabled = true;
  lastResult = '尚未分享。';
  result.textContent = lastResult;
  if (!chosen) { selected.textContent = '請選擇一張 JPG 或 PNG。'; return; }
  if (!['image/jpeg', 'image/png'].includes(chosen.type)) {
    chosen = null;
    selected.textContent = '請改選 JPG 或 PNG 圖片。';
    return;
  }
  selected.textContent = chosen.name + ' · ' + (chosen.size / 1024 / 1024).toFixed(2) + ' MB';
  if (!navigator.share) {
    selected.textContent += '\n這個瀏覽器不支援系統分享。';
    return;
  }
  try {
    if (navigator.canShare && !navigator.canShare({ files: [chosen] })) {
      selected.textContent += '\n這個瀏覽器不支援分享此圖片。';
      return;
    }
  } catch (_) {
    selected.textContent += '\n這個瀏覽器無法使用此圖片分享。';
    return;
  }
  shareButton.disabled = false;
});

shareButton.addEventListener('click', () => {
  if (!chosen || pending) return;
  const file = chosen;
  pending = true;
  const at = new Date().toLocaleTimeString('zh-TW', { hour12: false });
  const info = '時間：' + at + '\n圖片：1 張，' + file.type + '，' + file.size + ' bytes\n';
  lastResult = info + '等待系統分享回覆。';
  try {
    // Keep the selected File intact. Invoke once, directly within the click.
    const operation = navigator.share({ files: [file] });
    operation.then(() => {
      pending = false;
      lastResult = info + '系統已接受分享。LINE 是否開啟聊天室，請以實際畫面為準。';
    }, error => {
      pending = false;
      lastResult = info + '系統未完成分享：' + (error && error.name || 'Error');
    });
  } catch (error) {
    pending = false;
    lastResult = info + '無法開啟分享：' + (error && error.name || 'Error');
  }
});

// Only a manual expansion writes the result to the page; sharing itself does
// not show a dialog, update the DOM, move focus, reload, or retry.
document.getElementById('details').addEventListener('toggle', event => {
  if (event.target.open) result.textContent = lastResult;
});
</script>
</body>
</html>
